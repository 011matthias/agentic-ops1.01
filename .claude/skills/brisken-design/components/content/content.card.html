<!-- @dsCard group="Components" viewport="700x400" subtitle="TickCard, StepList, LogoWell, CredentialRow, Stat, FaqRow, SlideFooter" name="Content" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; background: var(--brisken-white); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Babel Standalone's automatic <script type="text/babel"> handling is unreliable inside
  // sandboxed preview frames, so the JSX is fetched, transformed and injected explicitly.
  Babel.registerPreset('brisken', { presets: [[Babel.availablePresets.react, { runtime: 'classic' }]] });
  (async function () {
    const files = [];
    for (const file of files) {
      const src = await (await fetch(file)).text();
      const code = Babel.transform(src, { presets: ['brisken'], filename: file }).code;
      const el = document.createElement('script');
      el.textContent = code;
      document.head.appendChild(el);
    }
    const app = document.createElement('script');
    app.textContent = Babel.transform("const ns = (function () {\n  for (const k of Object.keys(window)) {\n    try {\n      const v = window[k];\n      if (v && typeof v === 'object' && v.TickCard) return v;\n    } catch (e) { /* cross-origin frame proxy */ }\n  }\n  return {};\n})();\nconst { TickCard, StepList, LogoWell, CredentialRow, Stat, FaqRow, SlideFooter } = ns;\nfunction Card() {\n  const [open, setOpen] = React.useState(true);\n  return (\n    <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>\n      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 0.9fr', gap: 12 }}>\n        <TickCard title=\"Systems connected\" pad={18}>Your ERP, treasury and finance systems — linked to the banks, market data and authorities around them.</TickCard>\n        <TickCard title=\"You stay in control\" accent=\"bright\" pad={18}>People own the moves that matter.</TickCard>\n        <StepList badgeSize={26} gap={8} steps={['Reads the funding email.', 'Checks the group cash position.', 'Drafts the memo in SAP.']} />\n      </div>\n      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 10 }}>\n        <LogoWell src=\"../../assets/customer-logos/ford.png\" alt=\"Ford\" height={52} />\n        <LogoWell src=\"../../assets/customer-logos/nike.png\" alt=\"Nike\" height={52} />\n        <LogoWell src=\"../../assets/customer-logos/equinor.png\" alt=\"Equinor\" height={52} />\n        <LogoWell src=\"../../assets/customer-logos/adm.png\" alt=\"ADM\" height={52} />\n        <LogoWell alt=\"empty slot\" height={52} />\n      </div>\n      <div style={{ display: 'flex', gap: 24, alignItems: 'flex-start' }}>\n        <Stat value=\"71%\" source=\"Brisken research, live SAP treasury job ads\" style={{ maxWidth: 260 }}>\n          of the live SAP treasury job ads describe extensive manual data plumbing into SAP.\n        </Stat>\n        <div style={{ flex: 1 }}>\n          <FaqRow question=\"Is AI automation in treasury safe?\" open={open} onToggle={() => setOpen(!open)}>\n            An agent acts only within the permissions and limits you set, a person owns the moves that matter, and every action is logged.\n          </FaqRow>\n        </div>\n      </div>\n      <CredentialRow items={['SAP Co-Innovation Partner', 'Listed on the SAP Store', 'ISO 27001', 'SOC 1 Type II']} />\n      <SlideFooter page=\"09\" scale={0.6} />\n    </div>\n  );\n}\nReactDOM.createRoot(document.getElementById('root')).render(<Card />);", { presets: ['brisken'], filename: 'app.jsx' }).code;
    document.head.appendChild(app);
  })();
</script>
</body>
</html>
