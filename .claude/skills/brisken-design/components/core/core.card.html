<!-- @dsCard group="Components" viewport="700x300" subtitle="Eyebrow, Headline, Button, Chip, NumberBadge, Band" name="Core" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; background: var(--brisken-white); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Babel Standalone's automatic <script type="text/babel"> handling is unreliable inside
  // sandboxed preview frames, so the JSX is fetched, transformed and injected explicitly.
  Babel.registerPreset('brisken', { presets: [[Babel.availablePresets.react, { runtime: 'classic' }]] });
  (async function () {
    const files = [];
    for (const file of files) {
      const src = await (await fetch(file)).text();
      const code = Babel.transform(src, { presets: ['brisken'], filename: file }).code;
      const el = document.createElement('script');
      el.textContent = code;
      document.head.appendChild(el);
    }
    const app = document.createElement('script');
    app.textContent = Babel.transform("const ns = (function () {\n  for (const k of Object.keys(window)) {\n    try {\n      const v = window[k];\n      if (v && typeof v === 'object' && v.Eyebrow) return v;\n    } catch (e) { /* cross-origin frame proxy */ }\n  }\n  return {};\n})();\nconst { Eyebrow, Headline, Button, Chip, NumberBadge, Band } = ns;\nfunction Card() {\n  return (\n    <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>\n      <div>\n        <Eyebrow>THE PLATFORM · GOVERNANCE</Eyebrow>\n        <Headline size=\"s\" style={{ marginTop: 6 }}>Governed, in plain terms.</Headline>\n      </div>\n      <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>\n        <Button size=\"s\">Book a demo</Button>\n        <Button size=\"s\" variant=\"ghost\">More details</Button>\n        <Button size=\"s\" variant=\"quiet\">The problem →</Button>\n        <div style={{ background: 'var(--brisken-ink-900)', padding: 8, borderRadius: 8 }}>\n          <Button size=\"s\" variant=\"onDark\">Open TreasuryCentral</Button>\n        </div>\n      </div>\n      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>\n        <Chip>Market Data Hub</Chip>\n        <Chip>Remittance advice</Chip>\n        <Chip variant=\"filled\" align=\"center\">SAP ECC &amp; S/4HANA</Chip>\n        <Chip variant=\"accent\">+ your own apps</Chip>\n      </div>\n      <div style={{ display: 'flex', gap: 14, alignItems: 'center' }}>\n        <NumberBadge n={1} /><NumberBadge n={2} /><NumberBadge n={3} tone=\"ink\" />\n        <Band tone=\"ink\" style={{ flex: 1 }}>CONNECTS TO   Bloomberg · Refinitiv · 360T  →  SAP ECC &amp; S/4HANA</Band>\n      </div>\n    </div>\n  );\n}\nReactDOM.createRoot(document.getElementById('root')).render(<Card />);", { presets: ['brisken'], filename: 'app.jsx' }).code;
    document.head.appendChild(app);
  })();
</script>
</body>
</html>
