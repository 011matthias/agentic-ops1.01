<!-- @dsCard group="Website" viewport="1280x900" -->
<!-- @startingPoint section="Website" subtitle="brisken.com, with the OnePilot platform site behind the logo" viewport="1280x900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brisken — website UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; }
  h1, h2, h3, h4, p { margin: 0; }
</style>
</head>
<body data-theme="web">
<div id="root">
  <!-- static first paint; React replaces this once the JSX modules are transformed -->
  <div style="min-height:100vh;background:#F4F7FB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;font-family:Lato,system-ui,sans-serif">
    <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#0E7C86;background:#E4F3F4;border-radius:999px;padding:7px 18px">Financial-data platform for SAP. Governed, no code.</div>
    <div style="font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:60px;line-height:1.14;letter-spacing:-.01em;color:#01396F;text-align:center;max-width:900px">Financial Data. Solved. End to End.</div>
  </div>
</div>
<script>
  Babel.registerPreset('brisken', { presets: [[Babel.availablePresets.react, { runtime: 'classic' }]] });
  (async function () {
    for (const file of ["ds.jsx","SiteChrome.jsx","DemoDialog.jsx","HomeScreen.jsx","OnePilotScreen.jsx"]) {
      const src = await (await fetch(file)).text();
      const el = document.createElement('script');
      el.textContent = Babel.transform(src, { presets: ['brisken'], filename: file }).code;
      document.head.appendChild(el);
    }
    const app = document.createElement('script');
    app.textContent = Babel.transform("function App() {\n  const [site, setSite] = React.useState('tc');\n  const [theme, setTheme] = React.useState('web');\n  const [demo, setDemo] = React.useState(false);\n  React.useEffect(() => { document.body.setAttribute('data-theme', theme); }, [theme]);\n  return (\n    <React.Fragment>\n      <SiteHeader site={site} theme={theme} onNavigate={setSite} onToggleTheme={() => setTheme(theme === 'web' ? 'web-dark' : 'web')} onDemo={() => setDemo(true)} />\n      {site === 'tc' ? <HomeScreen onDemo={() => setDemo(true)} /> : <OnePilotScreen onDemo={() => setDemo(true)} />}\n      <SiteFooter />\n      <DemoDialog open={demo} onClose={() => setDemo(false)} />\n    </React.Fragment>\n  );\n}\nReactDOM.createRoot(document.getElementById('root')).render(<App />);", { presets: ['brisken'], filename: 'app.jsx' }).code;
    document.head.appendChild(app);
  })();
</script>
</body>
</html>
