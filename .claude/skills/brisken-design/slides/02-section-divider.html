<!-- @dsCard group="Slides" viewport="1280x720" subtitle="Ink field, 13px teal top bar, numbered section" name="Section divider" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: #0F1417; overflow: hidden; }
  .frame { width: 1280px; height: 720px; overflow: hidden; }
  .slide {
    position: relative;
    width: 1920px; height: 1080px;
    background: #0F1417;
    transform: scale(0.6666667);
    transform-origin: 0 0;
    font-family: var(--font-deck-sans);
    color: var(--brisken-ink-900);
  }
  .slide * { box-sizing: border-box; }
  .a { position: absolute; }
  .eyebrow { left: 89px; top: 89px; font-weight: 600; font-size: 25px; letter-spacing: .2em; color: var(--brisken-teal-600); }
  .headline { left: 89px; top: 147px; width: 1684px; font-family: var(--font-deck-display); line-height: 1.02; color: var(--brisken-ink-900); }
  .lead { left: 89px; width: 1642px; font-size: 32px; line-height: 1.25; color: var(--brisken-slate-600); }
  .rule { left: 89px; top: 996px; width: 1741px; height: 2px; background: var(--brisken-line-200); }
  .foot { top: 1008px; font-size: 18px; color: var(--brisken-slate-400); }
  .foot.l { left: 89px; letter-spacing: .045em; }
  .foot.r { left: 1543px; width: 288px; text-align: right; }
  .card { background: var(--brisken-surface-100); border-radius: 28px; }
  .tick { width: 49px; height: 7px; background: var(--brisken-teal-600); }
  .tick.bright { background: var(--brisken-teal-400); }
  .ctitle { font-weight: 600; font-size: 31px; line-height: 1.15; color: var(--brisken-ink-900); }
  .cbody { font-size: 27px; line-height: 1.14; color: var(--brisken-slate-600); }
  .logo { position: absolute; right: 89px; bottom: 58px; width: 224px; }
  .band { border-radius: 9px; display: flex; flex-direction: column; justify-content: center; }
</style>
</head>
<body>
<div class="frame"><div class="slide">
  <div class="a" style="left:0;top:0;width:1920px;height:13px;background:var(--brisken-teal-600)"></div>
  <div class="a" style="left:89px;top:389px;font-family:var(--font-deck-display);font-size:52px;letter-spacing:.038em;color:var(--brisken-teal-400)">01</div>
  <div class="a" style="left:86px;top:455px;width:1656px;font-family:var(--font-deck-display);font-size:92px;line-height:1;color:var(--brisken-surface-050)">About</div>
  <div class="a" style="left:89px;top:625px;width:1368px;font-size:32px;line-height:1.2;color:var(--brisken-slate-300)">Who we are, and who already runs on us.</div>
  <img class="logo" style="width:184px" src="../assets/logos/brisken-logo-reversed.png" alt="Brisken">
</div></div>
</body>
</html>
