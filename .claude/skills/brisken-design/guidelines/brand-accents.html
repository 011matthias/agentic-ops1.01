<!-- @dsCard group="Brand" viewport="700x180" subtitle="The tick, the numbered step, the arrow — the whole icon vocabulary" name="Brand marks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--brisken-white); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--brisken-slate-400); }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--brisken-slate-600); }

</style>
</head>
<body>
<div class="row" style="gap:28px;align-items:center">
  <div>
    <div style="width:49px;height:7px;background:var(--brisken-teal-600)"></div>
    <div class="mono" style="margin-top:10px">tick 49×7<br>above every card title</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <div style="width:34px;height:34px;border-radius:9px;background:var(--brisken-teal-600);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center">1</div><div style="width:34px;height:34px;border-radius:9px;background:var(--brisken-teal-600);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center">2</div><div style="width:34px;height:34px;border-radius:9px;background:var(--brisken-teal-600);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center">3</div>
    <div class="mono" style="margin-left:6px">numbered<br>step badge</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <span style="color:var(--brisken-teal-400);font-size:22px">→</span>
    <span style="color:var(--brisken-slate-400);font-size:22px">·</span>
    <span style="color:var(--brisken-teal-600);font-size:22px">+</span>
    <div class="mono" style="margin-left:6px">arrow · dot · plus<br>no icon set</div>
  </div>
</div>
</body>
</html>
