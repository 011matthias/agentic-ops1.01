<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-deck-sans); background: var(--brisken-white); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--brisken-slate-400); }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--brisken-slate-600); }

</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:14px">
  <div style="font-weight:600;font-size:12.5px;letter-spacing:.2em;color:var(--brisken-teal-600)">THE PLATFORM · GOVERNANCE</div>
  <div style="font-weight:600;font-size:11.5px;letter-spacing:.14em;color:var(--brisken-slate-400)">BEFORE  ·  TODAY, BY HAND</div>
  <div style="font-weight:600;font-size:11.5px;letter-spacing:.14em;color:var(--brisken-teal-600)">AFTER  ·  THE DIGITAL CO-WORKER, IN ORDER</div>
  <div style="font-weight:600;font-size:11px;letter-spacing:.19em;color:var(--brisken-slate-400)">SOURCES</div>
</div>
<div class="mono" style="margin-top:14px">--tracking-eyebrow .2em · --tracking-label .14em · middle dot separates section from topic</div>
</body>
</html>
