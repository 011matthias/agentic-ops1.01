<!-- @dsCard group="Colors" viewport="700x160" subtitle="Two-colour discipline: one teal carries the brand" name="Brand teal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--brisken-white); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--brisken-slate-400); }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--brisken-slate-600); }

</style>
</head>
<body>
<div class="row">
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#0A5A61;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Teal 800</div>
  <div class="mono">#0A5A61</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-teal-800</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#0E7C86;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Teal 600 · PRIMARY</div>
  <div class="mono">#0E7C86</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-teal-600</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#17B0BE;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Teal 400 · accent</div>
  <div class="mono">#17B0BE</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-teal-400</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#00B5D0;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Cyan 400</div>
  <div class="mono">#00B5D0</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-cyan-400</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#D6ECEE;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Teal 100</div>
  <div class="mono">#D6ECEE</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-teal-100</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#EAFBFC;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Teal 050</div>
  <div class="mono">#EAFBFC</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-teal-050</div>
</div>
</div>
</body>
</html>
