<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--surface-page); }
  .row { display: flex; gap: 10px; }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-secondary); }
  .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body data-theme="web">
<div style="display:flex;flex-direction:column;gap:16px;align-items:flex-start">
  <div style="font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-eyebrow);background:var(--surface-eyebrow-pill);border-radius:999px;padding:7px 18px">Financial-data platform for SAP. Governed, no code.</div>
  <div style="font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-eyebrow)">Explore the platform</div>
  <div style="font-family:var(--font-mono);font-size:12.5px;letter-spacing:.1em;color:var(--text-muted)">SAP Co-Innovation Partner · ISO 27001 · SOC 1 Type II</div>
</div>
<div class="mono" style="margin-top:16px">--font-mono · pill fill --surface-eyebrow-pill for the hero eyebrow only</div>
</body>
</html>
