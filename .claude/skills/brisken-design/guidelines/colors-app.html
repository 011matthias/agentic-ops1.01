<!-- @dsCard group="Colors" viewport="700x170" subtitle="OnePilot product: near-black canvas, one blue accent, red mark" name="Product palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--surface-page); }
  .row { display: flex; gap: 10px; }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-secondary); }
  .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body data-theme="app">
<div class="row">
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#131314;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Canvas</div>
  <div class="mono">#131314</div>
  <div class="mono" style="opacity:.7">--op-canvas</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#1E1F20;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Surface</div>
  <div class="mono">#1E1F20</div>
  <div class="mono" style="opacity:.7">--op-surface</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#292A2C;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Input</div>
  <div class="mono">#292A2C</div>
  <div class="mono" style="opacity:.7">--op-input</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#E3E3E3;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Text</div>
  <div class="mono">#E3E3E3</div>
  <div class="mono" style="opacity:.7">--op-text</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#1876D2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Accent</div>
  <div class="mono">#1876D2</div>
  <div class="mono" style="opacity:.7">--op-accent</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#E8352E;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Mark</div>
  <div class="mono">#E8352E</div>
  <div class="mono" style="opacity:.7">--op-mark</div>
</div>
</div>
</body>
</html>
