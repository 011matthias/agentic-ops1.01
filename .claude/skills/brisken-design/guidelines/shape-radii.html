<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Soft, never pill — except numbered step badges" name="Radii" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--brisken-white); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--brisken-slate-400); }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--brisken-slate-600); }

</style>
</head>
<body>
<div class="row">

<div style="flex:1;text-align:center">
  <div style="height:64px;background:var(--surface-card);border-radius:4px"></div>
  <div class="mono" style="margin-top:6px">4px</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--radius-xs</div>
</div>
<div style="flex:1;text-align:center">
  <div style="height:64px;background:var(--surface-card);border-radius:8px"></div>
  <div class="mono" style="margin-top:6px">8px</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--radius-s</div>
</div>
<div style="flex:1;text-align:center">
  <div style="height:64px;background:var(--surface-card);border-radius:12px"></div>
  <div class="mono" style="margin-top:6px">12px</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--radius-m</div>
</div>
<div style="flex:1;text-align:center">
  <div style="height:64px;background:var(--surface-card);border-radius:16px"></div>
  <div class="mono" style="margin-top:6px">16px</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--radius-l</div>
</div>
<div style="flex:1;text-align:center">
  <div style="height:64px;background:var(--surface-card);border-radius:24px"></div>
  <div class="mono" style="margin-top:6px">24px</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--radius-card</div>
</div>
<div style="flex:1;text-align:center">
  <div style="height:64px;background:var(--surface-card);border-radius:999px"></div>
  <div class="mono" style="margin-top:6px">999px</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--radius-pill</div>
</div>
</div>
</body>
</html>
