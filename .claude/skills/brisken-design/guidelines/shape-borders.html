<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Fill or border — never both plus a shadow" name="Borders & elevation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--brisken-white); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--brisken-slate-400); }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--brisken-slate-600); }

</style>
</head>
<body>
<div class="row">
  <div style="flex:1;height:88px;background:var(--surface-card);border-radius:14px;padding:12px;box-sizing:border-box">
    <div style="width:34px;height:5px;background:var(--brisken-teal-600)"></div>
    <div style="font-size:11.5px;font-weight:600;margin-top:10px;color:var(--brisken-ink-900)">Flat card</div>
    <div class="mono" style="margin-top:4px">fill, no border, no shadow</div>
  </div>
  <div style="flex:1;height:88px;background:#fff;border:2px solid var(--border-subtle);border-radius:14px;padding:12px;box-sizing:border-box">
    <div style="font-size:11.5px;font-weight:600;color:var(--brisken-ink-900)">Bordered chip</div>
    <div class="mono" style="margin-top:4px">2px #E2E7E9</div>
  </div>
  <div style="flex:1;height:88px;background:#fff;border:4px solid var(--brisken-teal-400);border-radius:14px;padding:12px;box-sizing:border-box">
    <div style="font-size:11.5px;font-weight:600;color:var(--brisken-ink-900)">Hub / emphasis</div>
    <div class="mono" style="margin-top:4px">4px #17B0BE</div>
  </div>
</div>
</body>
</html>
