<!-- @dsCard group="Colors" viewport="700x150" subtitle="Four chart hues, plus green up and red down on figures" name="Product data colours" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--surface-page); }
  .row { display: flex; gap: 10px; }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-secondary); }
  .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body data-theme="app">
<div class="row" style="align-items:center">
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#1876D2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Chart 1</div>
  <div class="mono">#1876D2</div>
  <div class="mono" style="opacity:.7">--op-chart-1</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#069669;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Chart 2</div>
  <div class="mono">#069669</div>
  <div class="mono" style="opacity:.7">--op-chart-2</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#D97708;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Chart 3</div>
  <div class="mono">#D97708</div>
  <div class="mono" style="opacity:.7">--op-chart-3</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#7C3AED;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Chart 4</div>
  <div class="mono">#7C3AED</div>
  <div class="mono" style="opacity:.7">--op-chart-4</div>
</div>
  <div style="flex:1.4;padding-left:14px;border-left:1px solid var(--border-subtle)">
    <div class="mono" style="color:var(--op-positive);font-size:13px">+$4,665,043,094</div>
    <div class="mono" style="color:var(--op-negative);font-size:13px;margin-top:6px">$1,947,639</div>
    <div class="mono" style="margin-top:8px;opacity:.8">net positive green · redemptions red<br>figures always monospace</div>
  </div>
</div>
</body>
</html>
