<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px base, doubling through the mid range" name="Space scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--brisken-white); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--brisken-slate-400); }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--brisken-slate-600); }

</style>
</head>
<body>
<div class="row" style="align-items:flex-end">
<div style="text-align:center">
  <div style="width:6px;height:4px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">4</div></div><div style="text-align:center">
  <div style="width:6px;height:8px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">8</div></div><div style="text-align:center">
  <div style="width:6px;height:12px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">12</div></div><div style="text-align:center">
  <div style="width:8px;height:16px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">16</div></div><div style="text-align:center">
  <div style="width:10px;height:20px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">20</div></div><div style="text-align:center">
  <div style="width:12px;height:24px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">24</div></div><div style="text-align:center">
  <div style="width:16px;height:32px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">32</div></div><div style="text-align:center">
  <div style="width:20px;height:40px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">40</div></div><div style="text-align:center">
  <div style="width:24px;height:48px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">48</div></div><div style="text-align:center">
  <div style="width:32px;height:64px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">64</div></div><div style="text-align:center">
  <div style="width:40px;height:80px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">80</div></div><div style="text-align:center">
  <div style="width:48px;height:96px;background:var(--brisken-teal-600);border-radius:2px;margin:0 auto"></div>
  <div class="mono" style="margin-top:6px">96</div></div>
</div>
<div class="mono" style="margin-top:12px">--space-1 … --space-24 · section padding 96px · card padding 28px · grid gap 24px</div>
</body>
</html>
