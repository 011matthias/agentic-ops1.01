<!-- @dsCard group="Spacing" viewport="700x180" subtitle="White, hairline, 12px radius, teal left edge when it is proof" name="Website cards" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--surface-page); }
  .row { display: flex; gap: 10px; }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-secondary); }
  .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body data-theme="web">
<div class="row" style="gap:16px">
  <div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-left:3px solid var(--brisken-teal-600);border-radius:12px;padding:20px;box-shadow:var(--shadow-card)">
    <div style="font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brisken-teal-600)">Live today</div>
    <div style="font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--text-primary);margin-top:8px">Agricultural customer</div>
    <div style="font-size:14px;line-height:1.5;color:var(--text-secondary);margin-top:8px">Posts remittances into S/4HANA on a governed AI gate.</div>
  </div>
  <div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px;padding:20px;box-shadow:var(--shadow-card)">
    <div style="font-weight:700;font-size:14px;color:var(--text-primary)">Applications</div>
    <div style="font-size:11.5px;color:var(--text-muted);margin-top:6px">the apps in the workspace</div>
    <div class="mono" style="margin-top:14px;opacity:.7">plain node card, no edge</div>
  </div>
</div>
</body>
</html>
