<!-- @dsCard group="Colors" viewport="700x160" subtitle="brisken.com: navy type on a blue-grey page, teal for action" name="Website palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--surface-page); }
  .row { display: flex; gap: 10px; }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-secondary); }
  .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body data-theme="web">
<div class="row">
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#F4F7FB;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Page</div>
  <div class="mono">#F4F7FB</div>
  <div class="mono" style="opacity:.7">--brisken-navy-050</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#01396F;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Headline / nav</div>
  <div class="mono">#01396F</div>
  <div class="mono" style="opacity:.7">--brisken-navy-700</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#2D394A;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Body</div>
  <div class="mono">#2D394A</div>
  <div class="mono" style="opacity:.7">--brisken-navy-500</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#032E59;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Dark panel</div>
  <div class="mono">#032E59</div>
  <div class="mono" style="opacity:.7">--brisken-navy-800</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#052A52;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Footer</div>
  <div class="mono">#052A52</div>
  <div class="mono" style="opacity:.7">--brisken-navy-900</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#0E7C86;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div>
  <div style="font-size:11px;font-weight:700;color:var(--text-primary)">Action / eyebrow</div>
  <div class="mono">#0E7C86</div>
  <div class="mono" style="opacity:.7">--brisken-teal-600</div>
</div>
</div>
</body>
</html>
