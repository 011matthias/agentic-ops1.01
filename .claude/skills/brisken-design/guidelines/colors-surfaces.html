<!-- @dsCard group="Colors" viewport="700x160" subtitle="Flat fills and hairlines — no gradients anywhere" name="Surfaces & lines" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--brisken-white); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--brisken-slate-400); }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--brisken-slate-600); }

</style>
</head>
<body>
<div class="row">
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#FFFFFF;box-shadow:inset 0 0 0 1px var(--brisken-line-200);"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Page</div>
  <div class="mono">#FFFFFF</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--surface-page</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#F4F6F7;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Card fill</div>
  <div class="mono">#F4F6F7</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--surface-card</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#ECEFF0;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Palest / on-dark text</div>
  <div class="mono">#ECEFF0</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-surface-050</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#E2E7E9;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Hairline</div>
  <div class="mono">#E2E7E9</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--border-subtle</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#0F1417;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Dark section</div>
  <div class="mono">#0F1417</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--surface-dark</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#0E7C86;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Accent band</div>
  <div class="mono">#0E7C86</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--surface-accent</div>
</div>
</div>
</body>
</html>
