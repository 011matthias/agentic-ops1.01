<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--surface-page); }
  .row { display: flex; gap: 10px; }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-secondary); }
  .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body data-theme="web">
<div class="row" style="align-items:center;gap:16px">
  <span style="display:inline-flex;padding:13px 28px;border-radius:999px;background:var(--brisken-teal-600);color:#fff;font-weight:700;font-size:15px">Book a demo</span>
  <span style="display:inline-flex;padding:13px 28px;border-radius:999px;border:1px solid var(--brisken-teal-600);color:var(--brisken-teal-600);font-weight:700;font-size:15px">More details</span>
  <span style="display:inline-flex;padding:11px 22px;border-radius:999px;border:1px solid var(--border-subtle);color:var(--brisken-teal-600);font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase">Live on SAP</span>
  <span style="display:inline-flex;align-items:center;padding:14px;border-radius:8px;background:var(--brisken-navy-800)">
    <span style="display:inline-flex;padding:11px 24px;border-radius:999px;background:#fff;color:var(--brisken-navy-700);font-weight:700;font-size:14px">Book a demo</span>
  </span>
</div>
</body>
</html>
