<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--brisken-white); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--brisken-slate-400); }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--brisken-slate-600); }

</style>
</head>
<body>
<div class="row" style="gap:0">
  <div style="flex:1;background:#fff;box-shadow:inset 0 0 0 1px var(--border-subtle);display:flex;align-items:center;justify-content:center;height:112px;border-radius:10px 0 0 10px">
    <img src="../assets/logos/brisken-logo.png" alt="Brisken" style="width:200px">
  </div>
  <div style="flex:1;background:#0F1417;display:flex;align-items:center;justify-content:center;height:112px;border-radius:0 10px 10px 0">
    <img src="../assets/logos/brisken-logo-reversed.png" alt="Brisken" style="width:200px">
  </div>
</div>
<div class="mono" style="margin-top:10px">assets/logos/ · 210–224px wide on the 1920 slide canvas, bottom-right, 89px clearance</div>
</body>
</html>
