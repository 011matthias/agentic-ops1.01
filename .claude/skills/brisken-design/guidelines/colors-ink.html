<!-- @dsCard group="Colors" viewport="700x160" subtitle="Ink for headlines, three greys for everything else" name="Ink & greys" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { padding: 18px 20px; font-family: var(--font-sans); background: var(--brisken-white); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--brisken-slate-400); }
  .mono { font-family: var(--font-mono); font-size: 10.5px; color: var(--brisken-slate-600); }

</style>
</head>
<body>
<div class="row">
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#0F1417;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Ink 900</div>
  <div class="mono">#0F1417</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-ink-900</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#191F27;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Ink 800</div>
  <div class="mono">#191F27</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-ink-800</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#575B61;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Ink 700</div>
  <div class="mono">#575B61</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-ink-700</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#5B666B;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Slate 600 · body</div>
  <div class="mono">#5B666B</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-slate-600</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#8A9599;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Slate 400 · muted</div>
  <div class="mono">#8A9599</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-slate-400</div>
</div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px">
  <div style="height:56px;border-radius:6px;background:#9AA6AB;"></div>
  <div style="font-size:11px;font-weight:600;color:var(--brisken-ink-900)">Slate 300 · on dark</div>
  <div class="mono">#9AA6AB</div>
  <div class="mono" style="color:var(--brisken-slate-400)">--brisken-slate-300</div>
</div>
</div>
</body>
</html>
