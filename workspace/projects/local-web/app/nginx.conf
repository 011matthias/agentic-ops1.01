server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind the Fly TLS edge: nginx only sees http on :8080, so absolute
  # trailing-slash 301s would leak http://host:8080/... and reset the
  # browser. Emit relative redirects; the browser keeps https + the
  # public port. (Fixes ERR_CONNECTION_RESET on /<slug> without slash.)
  absolute_redirect off;
  port_in_redirect off;
  server_name_in_redirect off;

  # Astro 'directory' format: /praxis-uslu -> /praxis-uslu/index.html.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Fingerprinted assets (Astro _astro/*) are immutable.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:jpg|jpeg|png|webp|avif|svg|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
    image/svg+xml application/ld+json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  error_page 404 /index.html;
}
