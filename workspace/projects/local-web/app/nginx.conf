server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind the Fly TLS edge: nginx only sees http on :8080, so absolute
  # trailing-slash 301s would leak http://host:8080/... and reset the
  # browser. Emit relative redirects; the browser keeps https + the
  # public port. (Fixes ERR_CONNECTION_RESET on /<slug> without slash.)
  absolute_redirect off;
  port_in_redirect off;
  server_name_in_redirect off;

  # Astro 'directory' format: /praxis-uslu -> /praxis-uslu/index.html.
  # Serve the directory index DIRECTLY (200) for the no-slash URL instead
  # of letting nginx 301 to the trailing-slash form. A cached 301 (browsers
  # cache 301s persistently) was poisoning clients with the old bad target;
  # emitting no redirect at all removes the vector permanently.
  location / {
    try_files $uri $uri/index.html $uri.html $uri/ =404;
  }

  # Fingerprinted assets (Astro _astro/*) are immutable.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:jpg|jpeg|png|webp|avif|svg|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
    image/svg+xml application/ld+json;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # The HTML doc itself must never be served stale. Astro emits
  # fingerprinted assets (cached immutable above) + a tiny HTML shell;
  # only the shell changes on redeploy. Without this, browsers heuristic-
  # cache the HTML and a redeploy is invisible until a hard refresh
  # (recurring stale-demo class, 2026-05-19). 'no-cache' = store but
  # always revalidate; nginx answers with a cheap 304 when unchanged.
  # Inherited by `location /` (no add_header there); the asset/_astro
  # blocks define their own add_header so they keep immutable caching.
  add_header Cache-Control "no-cache" always;

  error_page 404 /index.html;
}
