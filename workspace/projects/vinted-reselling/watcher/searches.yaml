# EGRESS_PROXY_URL (context/.env, NOT here: it carries credentials)
#
# Unset by default, and unset is the recommended state. Vinted refuses
# datacenter IPs at the door (probed 2026-09-10 from Frankfurt: 403 on the
# homepage, first request, before a session could be minted), so a cloud host
# is not an option and a residential egress is the only way to run this
# somewhere other than the owner's own machine.
#
# Three consequences that belong next to the switch, not in a checkpoint:
#   1. It routes around an access control Vinted deliberately set. The watcher
#      stops being a polite reader on a home line and becomes evasion.
#   2. Residential pools are detected by BEHAVIOUR as well as address, so this
#      is not a guaranteed fix, and a detection plausibly lands on the owner's
#      SELLING account rather than on an anonymous reader. The risk moves from
#      the tool to the business.
#   3. Much of the residential-proxy supply is sourced from consumer devices
#      whose owners were opted in through bundled SDKs. If this is used at all,
#      use a provider with audited consent, not the cheapest per GB.
#
# The poll rate does not change because a proxy exists. Same cadence, same
# read-only posture, no auto-buy, no auto-listing.

# Vinted watcher config. Edit freely; the watcher reads this on every cycle.
# tag: short stable id (used as the comp-grouping key in the database;
#      renaming a tag orphans its history, so pick names you can keep).
# query: the literal Vinted search text.
# price_max: alert cap in EUR (total incl. buyer fee). Listings above it are
#            still recorded as comp data, just never alerted.
#
# Per-search overrides (all optional):
#   size_classes:    which normalised size classes may alert for this search
#   deal_ratio:      tighten or loosen this one search's bar
#   alerts_disabled: true keeps collecting data but never alerts (probe mode,
#                    and the "drop" state of the brand rules; the price history
#                    is the asset, so a dropped brand keeps feeding it)

# Hand-set 2026-09-06 after first live afternoon (52 alerts / ~6h was a
# firehose at 0.62/6/5). Judgment values until the backtest scorer exists;
# proper calibration goes through /comd_optimize once ~2 weeks of gone-data
# has accumulated (see status/watcher.md).
settings:
  deal_ratio: 0.55        # alert when total price <= ratio * comp median
  min_comps: 8            # minimum comparable listings before scoring fires
  comp_window_days: 45    # how far back comps count
  min_price: 8            # floor in EUR (total incl. fee); below this a flip is not worth the time

  # Alert-side size focus. Comps keep every size; only the phone is filtered.
  # xl / DE 52 is deliberately out of the default: whether a class earns a slot
  # is a per-product call fed by the size-demand block of --brand-report.
  size_classes: [s, m, l, w29, w30, w31, w32, w33, w34]

  min_margin: 0           # EUR below the comp median a deal must clear; 0 = off
  foreign_advantage_eur: 8   # non-DE listings must beat the bar by this much extra

  fake_risk_suppress: 0.7    # at or above this the alert is withheld
  fake_risk_flag: 0.4        # at or above this the alert carries a warning line

  # The learned taste layer only overrules a cell after it has really been
  # rated; below profile_min_rated it can rank, never suppress.
  profile_suppress: 0.15
  profile_min_rated: 8

searches:
  - tag: carhartt-jacke
    query: "carhartt jacke"
    price_max: 45
  - tag: carhartt-hose
    query: "carhartt hose"
    price_max: 35
  - tag: rl-strick
    query: "ralph lauren strickpullover"
    price_max: 30
  - tag: tnf-jacke
    query: "the north face jacke"
    price_max: 40
  - tag: patagonia
    query: "patagonia"
    price_max: 40
  - tag: levis-501
    query: "levis 501"
    price_max: 25
    # Women's 501 rides on this tag rather than a search of its own: a listing
    # keeps the tag it was first seen under, so a separate "levis 501 damen"
    # search would only ever collect the leftovers into a starved comp pool.
    size_classes: [s, m, l, w26, w27, w28, w29, w30, w31, w32, w33, w34]
  - tag: stone-island
    query: "stone island"
    price_max: 60
  - tag: nike-vintage
    query: "nike vintage"
    price_max: 25
  - tag: adidas-vintage
    query: "adidas vintage"
    price_max: 25

  # Damen-Premium-Denim, aufgenommen 2026-09-08 nach Live-Probe (--probe-search).
  # Groessen als Buchstaben, nicht als W-Zahlen: so listet dieser Markt.
  # 7 for all mankind fiel durch (Median 18,55 EUR, Marge am Gate 8,35 EUR);
  # viel Altbestand aus der 2005-2012-Welle, schwache aktuelle Nachfrage.
  - tag: agolde
    query: "agolde"
    price_max: 90
    # Median 126,70 EUR bei 98% Markenreinheit, Marge am Gate 56,78 EUR.
    size_classes: [xs, s, m, w26, w27, w28, w29, w30, w31]
  - tag: mother-denim
    query: "mother jeans"
    price_max: 90
    # Median 126,70 EUR bei 98% Markenreinheit, gleiche Rechnung wie Agolde.
    size_classes: [xs, s, m, w26, w27, w28, w29, w30, w31]
  - tag: citizens-of-humanity
    query: "citizens of humanity"
    price_max: 60
    # Median 30,10 EUR traegt am Standard-Gate nur 14,49 EUR Marge. Der eigene
    # deal_ratio hebt sie ueber die 15-EUR-Schwelle des Owners.
    deal_ratio: 0.50
    size_classes: [xs, s, m, w26, w27, w28, w29, w30, w31]
