# Vinted watcher config. Edit freely; the watcher reads this on every cycle.
# tag: short stable id (used as the comp-grouping key in the database;
#      renaming a tag orphans its history, so pick names you can keep).
# query: the literal Vinted search text.
# price_max: alert cap in EUR (total incl. buyer fee). Listings above it are
#            still recorded as comp data, just never alerted.

# Hand-set 2026-09-06 after first live afternoon (52 alerts / ~6h was a
# firehose at 0.62/6/5). Judgment values until the backtest scorer exists;
# proper calibration goes through /comd_optimize once ~2 weeks of gone-data
# has accumulated (see status/watcher.md).
settings:
  deal_ratio: 0.55        # alert when total price <= ratio * comp median
  min_comps: 8            # minimum comparable listings before scoring fires
  comp_window_days: 45    # how far back comps count
  min_price: 8            # floor in EUR; below this a flip is not worth the time

searches:
  - tag: carhartt-jacke
    query: "carhartt jacke"
    price_max: 45
  - tag: carhartt-hose
    query: "carhartt hose"
    price_max: 35
  - tag: rl-strick
    query: "ralph lauren strickpullover"
    price_max: 30
  - tag: tnf-jacke
    query: "the north face jacke"
    price_max: 40
  - tag: patagonia
    query: "patagonia"
    price_max: 40
  - tag: levis-501
    query: "levis 501"
    price_max: 25
  - tag: stone-island
    query: "stone island"
    price_max: 60
  - tag: nike-vintage
    query: "nike vintage"
    price_max: 25
  - tag: adidas-vintage
    query: "adidas vintage"
    price_max: 25
