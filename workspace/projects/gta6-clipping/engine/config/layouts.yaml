# Layout-Profile für den Hochformat-Schnitt (p1.5): wo im 1920x1080-Bild des
# Streamers die Facecam sitzt und welcher Ausschnitt das Gameplay zeigt.
# Rechtecke als [x, y, Breite, Höhe] in Quell-Pixeln. Die Facecam wird um ihre
# Mitte auf 1080x640 geweitet (oben). Aus dem Gameplay-Rechteck schneidet der Renderer
# einen Ausschnitt im Seitenverhältnis des unteren Bands (1080x1280, aus 1080 px Höhe
# 912 px breit), der dem Hauptobjekt folgt (follow.py): das Band ist gefüllt und das
# Hauptobjekt bleibt vollständig sichtbar (Owner 2026-11-19).
#
# Kalibrieren: Standbild mit Raster ziehen (ffmpeg drawgrid, 160x120 px),
# ansehen, Rechtecke eintragen. Ändert ein Streamer sein Overlay, neu kalibrieren.
# Rückt die Cam mitten im Stream, gilt bis `until_s` (Sekunden im VOD) ein Eintrag
# unter `earlier` für diesen VOD (produce.layout_at).

ohnepixel:
  facecam: [230, 700, 440, 380]    # freigestellt unten links, ohne Rahmen
  gameplay: [680, 0, 1240, 1080]   # rechts der Cam: m76 (Rennen, Fahrer links) zeigte sie im Band
  calibrated: "2026-11-19, VOD 2932275268 bei 4:53:53; gameplay 2026-11-20, VOD 2934862154"

caseoh_:
  facecam: [0, 134, 402, 302]      # gerahmte 4:3-Cam oben links
  cam_crop: [0, 182, 402, 238]     # Ausschnitt fürs obere Band, innerhalb des Rahmens, 1080:640
  gameplay: [0, 0, 1920, 1080]
  calibrated: "2026-11-19, Clip BeautifulModernTermiteYouWHY bei 0:09 (kein VOD)"

xqc:
  facecam: [0, 540, 368, 292]      # Rechteck links in der Mitte, über der Minikarte
  cam_crop: [0, 548, 368, 218]     # innerhalb des Rechtecks, Kopf ganz drin, 1080:640
  gameplay: [0, 0, 1920, 1080]
  calibrated: "2026-11-19, VOD 2932113307 bei 5:56:17"

kaicenat:
  facecam: [0, 432, 392, 220]      # Rechteck links in der Mitte, Chat direkt darunter
  cam_crop: [10, 432, 372, 220]    # 1080:640 innerhalb, sonst wächst die Cam in den Chat
  gameplay: [400, 0, 1520, 1080]   # ohne Cam und Chat links: m30 zeigte beide im Band
  calibrated: "2026-11-19, VOD 2932305259 bei 2:52:40 und 8:35:45"
  earlier:                         # derselbe Stream, bevor die Cam nach unten rückte
    - video: "2932305259"
      until_s: 5175                # zwischen 5100 s (oben) und 5250 s (unten) gemessen
      facecam: [0, 350, 392, 220]
      cam_crop: [10, 350, 372, 220]

jasontheween:
  facecam: [1605, 0, 315, 285]     # Rechteck oben rechts, Chat oben links bleibt im Spiel
  cam_crop: [1612, 30, 308, 182]   # 7 px vom linken Rand weg (dunkler Streifen), 1080:640
  gameplay: [0, 0, 1920, 1080]
  calibrated: "2026-11-19, VOD 2932190650 bei 1:12:11"

lacy:
  facecam: [0, 0, 494, 278]        # 16:9-Cam oben links ohne Rahmen, Chat oben rechts
  cam_crop: [12, 0, 469, 278]      # 1080:640 innerhalb, Kopf mittig
  gameplay: [0, 0, 1920, 1080]
  calibrated: "2026-11-20, VOD 2932194507 bei 2:02:23"
