[project]
name = "clipengine"
version = "0.1.0"
description = "GTA6 clip engine: watch streamers, pick the most-viewed moments, cut and edit vertical clips"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",   # Twitch Helix + YouTube feed
    "pyyaml>=6.0",   # streamer register
    "yt-dlp>=2026.10",
    "tzdata>=2024.1",  # publish slots in German time; Windows has no system tz database
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "numpy>=2.0"]
publish = [  # YouTube Data API upload with the owner's OAuth token
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
]
gpu = [
    "faster-whisper>=1.1",
    "numpy>=2.0",          # band bar check (stage 6), frame sampling (follow.py)
    "onnxruntime>=1.20",   # YOLOX-m detector for the gameplay window (follow.py)
    "nvidia-cublas-cu12>=12.4,<12.9.3 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.1,<10 ; sys_platform == 'win32'",
]

[project.scripts]
clipengine = "clipengine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
