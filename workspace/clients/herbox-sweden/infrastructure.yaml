# Herbox Sweden Infrastructure Configuration
# Documents all instances for the Herbox Sweden client

instances:
  - type: railway
    name: herbox-fastapi
    url: https://herbox-automations-production.up.railway.app
    health_endpoint: /health
    dashboard_url: https://railway.app/project/herbox-automations

  - type: n8n
    name: n8n-herbox-sweden
    url: https://primary-production-ef56.up.railway.app
    health_endpoint: /healthz
    api_url: https://primary-production-ef56.up.railway.app/api/v1
    env_key: N8N_HERBOX_SWEDEN_API_KEY
