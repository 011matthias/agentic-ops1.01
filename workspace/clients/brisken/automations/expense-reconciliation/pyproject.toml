[project]
name = "expense-recon"
version = "0.1.0"
description = "Brisken expense reconciliation platform (p1)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",   # Excel statement parser (v2 spec §7.1) + report writer
    "openai>=1.50",    # LLM categorizer + receipt vision (slice 2.2)
    "pypdf>=5.0",      # PDF text-layer extraction (digital receipts, 2.2)
    "pypdfium2>=4.30", # scanned-PDF rasterization for vision fallback (2.2)
    "pillow>=10.0",    # PNG encoding of rendered PDF pages (2.2)
    "rapidfuzz>=3.0",  # token_set_ratio for the merchant-registry alias match
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]   # httpx backs fastapi's TestClient
web = [
    "fastapi>=0.110",        # JSON API behind the Lovable SPA front end
    "uvicorn>=0.30",         # ASGI server
    "python-multipart>=0.0.9",  # multipart/form-data file uploads
    "aiosmtpd>=1.4",         # inbound SMTP listener (the app's own mailbox)
]

[project.scripts]
expense-recon = "expense_recon.cli:main"
expense-recon-inspect = "expense_recon.inspect:main"
expense-recon-web = "expense_recon.web.serve:main"
expense-recon-seed-registry = "expense_recon.seed_registry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
