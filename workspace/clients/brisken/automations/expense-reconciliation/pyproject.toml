[project]
name = "expense-recon"
version = "0.1.0"
description = "Brisken expense reconciliation platform (p1)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",  # Excel statement parser (v2 spec §7.1) + report writer
    "openai>=1.50",   # LLM categorizer + (future slice 2b) receipt vision
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
expense-recon = "expense_recon.cli:main"
expense-recon-inspect = "expense_recon.inspect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
