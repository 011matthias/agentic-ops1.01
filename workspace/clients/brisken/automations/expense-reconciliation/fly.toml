# Fly.io config for the hosted Brisken expense-reconciliation workbench.
# Frankfurt (EU) for data residency. Pinned ALWAYS-ON since 2026-09-10
# (both services: the port-25 MX for expenses.brisken.com sits behind the
# same machine, and an auto-start that fails takes the mailbox down with
# the UI; never restore scale-to-zero). The run database + receipt files
# live on the recon_data_v2 volume mounted at /data (forked 2026-09-10;
# the old recon_data is an unattached rollback copy). Access is gated by
# EXPENSE_RECON_OPERATOR_CODE (set as a Fly secret, never committed).
#
# This file mirrors `flyctl config show -a brisken-expense-recon` as of
# 2026-09-11. `flyctl deploy` from this directory ships THIS config, so a
# stale copy here would silently undo the platform-side settings above;
# re-sync it whenever the platform config changes.
app = "brisken-expense-recon"
primary_region = "fra"

[build]

[env]
  EXPENSE_RECON_WEB_DATA = "/data"
  # Mail intake (the app's own mailbox): the in-app SMTP listener on :2525,
  # published on public port 25 below (needs the app's dedicated IPv4 —
  # MX targets can only be port 25). expenses.brisken.com MX points here.
  EXPENSE_RECON_INTAKE_SMTP = "1"
  EXPENSE_RECON_INTAKE_DOMAIN = "expenses.brisken.com"
  # Phase-5 COA gate: per-entity provisioning file on the /data volume
  # (coa_provision.py). Inert until the file is present (fail-open, no-op),
  # so this is safe to ship ahead of the upload. Upload coa-provision.json +
  # zoho-books-coa.json to /data to activate; the next run picks them up.
  EXPENSE_RECON_COA_PROVISION = "/data/coa-provision.json"
  # "Same photo, same answer": content-hash cache of raw vision-extraction
  # payloads (llm/extraction_cache.py). A re-uploaded or re-run document is
  # answered from the store — deterministic and free. Delete the file to
  # force fresh readings; prompt/schema edits invalidate it automatically.
  EXPENSE_RECON_EXTRACTION_CACHE = "/data/extraction-cache.sqlite"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "get"
    path = "/healthz"

# Inbound SMTP (mail intake). Raw TCP pass-through: the app's aiosmtpd
# listener speaks the protocol; the Fly proxy just forwards port 25 from
# the dedicated IPv4. Always-on, like the HTTP service above: an MX target
# has to answer at any hour.
[[services]]
  protocol = "tcp"
  internal_port = 2525
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 25

[mounts]
  source = "recon_data_v2"
  destination = "/data"

# 1024 MB since 2026-09-11 (owner order, backlog item 50: the live machine
# was raised to 1024 on 2026-09-11 and a deploy at 512 would shrink it).
[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
