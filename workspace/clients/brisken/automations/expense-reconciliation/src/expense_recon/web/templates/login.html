<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Brisken Expense Reconciliation</title>
<style>
  :root {
    --bg: #0f1318; --surface: #171c23; --text: #e6e9ee; --muted: #9aa4b1;
    --border: #2a323c; --accent: #5b8cff; --orange: #fbbf24; --orange-bg: #2c2310;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px 26px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 15px;
  }
  button {
    width: 100%; margin-top: 16px; background: var(--accent); color: #fff; border: 0;
    border-radius: 999px; padding: 11px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  .alert {
    background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange);
    border-radius: 8px; padding: 9px 12px; font-size: 13.5px; margin-bottom: 16px;
  }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Brisken Expense Reconciliation</h1>
    <p class="sub">Enter the access code to continue.</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <label for="code">Access code</label>
    <input type="password" id="code" name="code" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
    <div class="foot">UnpauseAI</div>
  </form>
</body>
</html>
