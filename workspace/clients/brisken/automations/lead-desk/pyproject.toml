[project]
name = "lead-desk"
version = "0.1.0"
description = "Brisken Lead Desk: single-source-of-truth lead-generation tracker (event-logged)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",   # xlsx migration import + xlsx export
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]   # httpx backs fastapi's TestClient
web = [
    "fastapi>=0.110",          # gated review app (browser UI over the event log)
    "uvicorn>=0.30",           # ASGI server
    "python-multipart>=0.0.9", # multipart/form-data for the touch/suppress forms
    "jinja2>=3.1",             # server-rendered templates
    "requests>=2.31",          # sheet-sync (sync.py) Graph app-only calls, POST /sync
]
capture = ["httpx>=0.27"]      # Phase 2 Graph capture worker (app-only reads + POST /events)
# Local Windows send worker (Outlook COM). Never in the Fly image: the
# Dockerfile installs .[web] only, so pywin32 cannot break the Linux build.
worker = ["httpx>=0.27", "pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
lead-desk-web = "lead_desk.web.serve:main"
lead-desk-migrate = "lead_desk.migrate:main"
lead-desk-export = "lead_desk.export:main"
lead-desk-sync = "lead_desk.sync:main"
lead-desk-ground = "lead_desk.ground:main"
lead-desk-capture = "lead_desk.capture:main"
lead-desk-adopt = "lead_desk.adopt:main"
lead-desk-reconcile = "lead_desk.reconcile_cli:main"
lead-desk-worker = "lead_desk.worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
