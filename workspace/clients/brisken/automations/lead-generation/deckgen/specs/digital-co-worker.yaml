# Digital Co-Worker — where the use cases live (deck-foundation-v2).
# Sources: [CUR] = current Dirk-kept DCW deck (cur_dcw), [REF] = reference donor
# text kept (donors 18/19/21/22/26), [T] = 2026-07-17 owner transcripts (use
# cases hang off the Digital Co-Worker; func diagram = generalized PROCESS edition).
# BTP: omitted per standing directive; platform line uses Dirk's own
# "on SAP's own cloud" phrasing ([CUR] s10).
# Chemicals-customer example anonymized per 2026-07-10 directive.
deck: digital-co-worker
output: "Brisken - Digital Co-Worker 2026-08 PROPOSAL"
slides:
  - pattern: cover
    patch:
      cover-title: {runs: {"Solutions Overview": "Digital Co-Worker"}}

  - pattern: short-version
    patch:
      sv-rows:
        paras:
          - "What it is: an AI co-worker for every person on your team; it does the busywork across your systems, in chat or in the background."
          - "What it replaces: the manual middle of every request: read, check, open the system, key in, write back."
          - "What you get: less busywork, more judgment; every step checked and logged."
          - "Who it is for: every person on your team, inside your SAP landscape."
      sv-handoff: {set: "Then four real requests, followed end to end."}

  - pattern: problem
    patch:
      pb-headline: {set: "Real work is a dozen small steps across a dozen systems."}
      pb-body:
        paras:
          - "A request arrives: an email, a message, a form."
          - "The manual middle: read it, check the balance, open the system, key in the record, write back."
          - "Your systems: SAP, email, files."

  # Dirk's own DCW features slide, kept verbatim (donor 18).
  # ChatGPT scrub for proposal consistency with the Overview revision (Dirk's
  # own line generalized; flagged in the report — his call to restore)
  - pattern: features-dcw
    patch:
      feat-body: {sub: {", such as ChatGPT)": ")"}}

  # Generalized PROCESS edition [T]: sources = inputs/triggers, destinations =
  # outcomes. Governance list stays donor.
  - pattern: func-diagram-dcw
    patch:
      fd-header:
        runs:
          "SAP Business Technology Platform": "on SAP's own cloud"
      fd-src-1: {set: "Emails / Requests"}
      fd-src-2: {set: "Remittance advices / Invoices"}
      fd-src-3: {set: "Funding requests"}
      fd-src-4: {set: "Bank statements"}
      fd-src-5: {set: "Any document, any trigger"}
      fd-dest-list:
        paras:
          - "SAP postings"
          - "Memo records"
          - "Confirmations"
          - "Replies"
          - "Any downstream system"

  # Use case 1 — chemicals customer, anonymized [T] + [CUR] s5. This is the
  # real "funding request powered by AI" deployment (reference success story,
  # slide 30). Chemicals: 6 customers, 5 on active cloud subscription.
  - pattern: usecase
    patch:
      uc-title: {set: "Intercompany Funding Request"}
      uc-logo-name: {runs: {"Bank Statement Generator": "Digital Co-Worker"}}
      uc-col1-body:
        outline:
          - [0, "Description"]
          - [1, "At a chemicals group, subsidiaries email the in-house bank to ask for funding. Today a treasury analyst reads each request and keys it in."]
          - [1, "The Digital Co-Worker reads the email, pulls out amount, currency, entity and value date, checks the group cash position and the intercompany limit, drafts the funding memo in SAP, and routes it for approval. On sign-off it posts and confirms back to the requester."]
          - [0, ""]
          - [0, "Challenges & Business Drivers"]
          - [1, "The request is free-text email; the work spans email, SAP in-house cash and the live cash position."]
          - [1, "Volume spikes at month-end, and every step today waits on a person."]
      uc-col2-body:
        outline:
          - [0, "Reads, checks, executes, confirms"]
          - [1, "Reads the request, pulls what it needs from your systems, and carries out each step."]
          - [1, "Confirms the result in chat and suggests the next action."]
          - [0, "Chat-like interaction"]
          - [1, "Ask it anything about the request in plain language; it answers in chat."]
          - [0, "Governed end to end"]
          - [1, "Every action checked and logged: audit trail, segregation of duty, anomaly alerts."]
          - [1, "Approvals where you want them; a person in the loop for the moves that matter."]

  # Use case 2 — Dirk's own Remittance Advice Gate one-pager, verbatim (donor 26).
  # The real "remittance powered by AI" deployment (reference success story,
  # slide 29, agricultural customer).
  - pattern: usecase-remit

  # Use case 3 — bank statement intake. Grounded in the logistics (5) +
  # high-volume treasury base; capability from the reference Bank Statement
  # Generator one-pager (donor 21), re-voiced for the Digital Co-Worker.
  - pattern: usecase
    patch:
      uc-title: {set: "Bank Statement Intake"}
      uc-logo-name: {runs: {"Bank Statement Generator": "Digital Co-Worker"}}
      uc-col1-body:
        outline:
          - [0, "Description"]
          - [1, "A logistics group banks with dozens of institutions; several send statements the SAP bank-connectivity channel never sees, each in its own format."]
          - [1, "The Digital Co-Worker reads a statement in any format, PDF, CSV or a proprietary line-item report, turns it into camt.053 or MT940, and delivers it to SAP cash management in time for the day's cash operations."]
          - [0, ""]
          - [0, "Challenges & Business Drivers"]
          - [1, "Statements sit in a mailbox or a data lake, outside the SAP landscape, in formats that are hard to read."]
          - [1, "Cash operations wait on these statements, so a late or missed one holds up the whole day."]
      uc-col2-body:
        outline:
          - [0, "Format agnostic"]
          - [1, "Reads line-item reports and statements in any format; generates camt.05x, MT94x or any target format."]
          - [0, "Target system agnostic"]
          - [1, "Delivers to SAP cash management, treasury or ERP; SAP and non-SAP, cloud and on-premise."]
          - [0, "On time, every day"]
          - [1, "Out-of-the-box connectivity, data validation, and a status monitor for completeness and timeliness."]
          - [0, "Governed end to end"]
          - [1, "Every statement validated and logged, with alerts on anything missing or odd."]

  # Use case 4 — internal demo, labeled as such [T]. The conversational,
  # interactive use case: distinct from the document-in/SAP-out ones above.
  - pattern: usecase
    patch:
      # short title (long titles collide with the logo group top-right);
      # the internal-demo labeling lives in Description + Challenges
      uc-title: {set: "Cash-Management Assistant"}
      uc-logo-name: {runs: {"Bank Statement Generator": "Digital Co-Worker"}}
      uc-col1-body:
        outline:
          - [0, "Description"]
          - [1, "Our internal demo: cash positioning with the Digital Co-Worker, entirely in chat."]
          - [1, "You ask where the cash is; it pulls the position across accounts, suggests payment requests from it, and answers follow-ups in plain language. The moves that matter wait for a person to sign off."]
          - [0, ""]
          - [0, "Challenges & Business Drivers"]
          - [1, "Cash decisions need timely information, pulled from several systems at once."]
          - [1, "Shown here as a working demo, not a customer deployment."]
      uc-col2-body:
        outline:
          - [0, "Conversational"]
          - [1, "You ask in plain language; it answers in chat and shows the result."]
          - [0, "Cash positioning"]
          - [1, "Pulls the position across your accounts on request, no report to run."]
          - [0, "Payment request suggestions"]
          - [1, "Suggests payment requests from the position; the moves that matter wait for a person to sign off."]
          - [0, "Governed end to end"]
          - [1, "Every step checked and logged, with a full audit trail."]

  # Use case 5 — Dirk's own Cash Flow & Exposure Hub one-pager, verbatim (donor 22).
  # Reads as the food & drink / FX-exposure setting (6 customers on active
  # cloud subscription); the reference text stays verbatim for maximum fidelity.
  - pattern: usecase-cashflow

  - pattern: platform-context
    patch:
      pc-app-dw: {highlight: true}
      pc-caption: {set: "The Digital Co-Worker is the AI application inside TreasuryCentral, the shipped edition of OnePilot. Its use cases run in production at chemicals and agricultural customers."}

  - pattern: contact
