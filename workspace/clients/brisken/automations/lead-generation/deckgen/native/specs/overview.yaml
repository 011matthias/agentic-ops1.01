    title: "Bank Fee Portal"
    gloss: "A bank fee statement is the bank's own record of what it charged you."
    before: "Banks send fee statements in many formats: CAMT.086 (the standard bank-fee format), XML, Twist BSB, and each bank's own. Someone reads and checks them by hand, so derived fees and overcharges are hard to catch."
    steps:
