# Fly.io config for the hosted Brisken OnePilot prototype review site.
# Frankfurt (EU). Scales to zero when idle; a request cold-starts it. Reviewer
# feedback lives on the onepilot_data volume mounted at /data. Access is gated
# by BRISKEN_SITE_ACCESS_CODE (set as a Fly secret, never committed).
app = "brisken-onepilot-proto"
primary_region = "fra"

[build]

[env]
  BRISKEN_SITE_DATA = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/healthz"

[mounts]
  source = "onepilot_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
