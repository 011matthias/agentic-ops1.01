<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{height:100vh;margin:0;display:flex;flex-direction:column;background:#eef2f7;font-family:'IBM Plex Sans',sans-serif;color:#0f172a;overflow:hidden;}
.topbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;

.topbar a{text-decoration:none;font-size:14px;font-weight:600;}
.tb-back{color:#475569;}
.tb-right{display:flex;align-items:center;gap:16px;}
.tb-dl{background:#0891b2;color:#fff;padding:8px 18px;border-radius:99px;}

.fallback{display:none;}
@media(max-width:620px){
  .viewer{display:none;}
  .fallback{display:block;text-align:center;padding:48px 24px;color:#475569;font-size:15px;line-height:1.6;}
  .fallback a{color:#0891b2;font-weight:600;}
}

<body>
<div class="topbar">
  <a class="tb-back" href="/">&larr; Brisken Resources</a>
