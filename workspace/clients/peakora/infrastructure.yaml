# Peakora Infrastructure Configuration
# Documents all n8n instances for the Peakora client

instances:
  - type: n8n
    name: n8n-peakora
    url: https://n8n.peakora.io
    health_endpoint: /healthz
    editor_url: https://n8n.peakora.io
    api_url: https://n8n.peakora.io/api/v1
    env_key: N8N_PEAKORA_API_KEY
