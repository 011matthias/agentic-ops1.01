<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspirierende Zitate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 140px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            color: #333;
            background: white;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .quotes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .quote-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            border-left: 4px solid #667eea;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quote-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #333;
            margin-bottom: 16px;
            font-style: italic;
        }

        .quote-text::before { content: '"'; font-size: 1.4rem; color: #667eea; }
        .quote-text::after  { content: '"'; font-size: 1.4rem; color: #667eea; }

        .quote-author {
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .quote-author::before { content: '— '; }

        .quote-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.72rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .tag-category {
            background: #f0f0ff;
            color: #667eea;
        }

        .tag-lang-de {
            background: #fff3e0;
            color: #f57c00;
        }

        .tag-lang-en {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status-bar {
            text-align: center;
            color: rgba(255,255,255,0.85);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .error-msg {
            background: #fff3f3;
            border: 1px solid #ffcdd2;
            border-radius: 8px;
            padding: 16px;
            color: #c62828;
            text-align: center;
            margin-bottom: 16px;
        }

        .loading-msg {
            text-align: center;
            color: rgba(255,255,255,0.9);
            padding: 40px;
            font-size: 1.1rem;
        }

        .empty-msg {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #888;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Inspirierende Zitate</h1>
    <p class="subtitle">Täglich neue Zitate aus aller Welt</p>

    <div class="controls">
        <div class="control-group">
            <label for="categorySelect">Kategorie</label>
            <select id="categorySelect">
                <option value="">Alle Kategorien</option>
                <option value="motivation">Motivation</option>
                <option value="wisdom">Weisheit</option>
                <option value="success">Erfolg</option>
                <option value="happiness">Glück</option>
                <option value="humor">Humor</option>
            </select>
        </div>

        <div class="control-group">
            <label for="langSelect">Sprache</label>
            <select id="langSelect">
                <option value="">Alle Sprachen</option>
                <option value="de">Deutsch</option>
                <option value="en">Englisch</option>
            </select>
        </div>

        <div class="control-group">
            <label for="limitSelect">Anzahl</label>
            <select id="limitSelect">
                <option value="3">3 Zitate</option>
                <option value="6">6 Zitate</option>
                <option value="9">9 Zitate</option>
            </select>
        </div>

        <button id="loadBtn" onclick="loadQuotes()">Neue Zitate laden</button>
    </div>

    <div id="errorMsg" class="error-msg" style="display:none"></div>
    <div id="quotesGrid" class="quotes-grid"></div>
    <div id="statusBar" class="status-bar"></div>
</div>

<script>
    // ─── KONFIGURATION ────────────────────────────────────────────────────────
    // Webhook-URL nach dem Bauen des A2-Workflows hier eintragen:
    const WEBHOOK_URL = 'https://unpauseai.app.n8n.cloud/webhook/ulf-quotes';
    // ─────────────────────────────────────────────────────────────────────────

    // Statische Fallback-Zitate (Deutsch) – werden angezeigt wenn API nicht erreichbar
    const FALLBACK_QUOTES = [
        { text: "Der beste Weg, die Zukunft vorherzusagen, ist, sie zu gestalten.", author: "Peter Drucker", category: "motivation", lang: "de" },
        { text: "Der einzige Weg, großartige Arbeit zu leisten, ist, die Arbeit zu lieben, die man tut.", author: "Steve Jobs", category: "motivation", lang: "de" },
        { text: "Wenn du es träumen kannst, kannst du es tun.", author: "Walt Disney", category: "motivation", lang: "de" },
        { text: "Erfolg ist nicht der Schlüssel zum Glück. Glück ist der Schlüssel zum Erfolg.", author: "Albert Schweitzer", category: "happiness", lang: "de" },
        { text: "Zwei Dinge sind unendlich: das Universum und die menschliche Dummheit; und bei dem Universum bin ich mir noch nicht ganz sicher.", author: "Albert Einstein", category: "humor", lang: "de" },
        { text: "Die beste Zeit, einen Baum zu pflanzen, war vor 20 Jahren. Die zweitbeste Zeit ist jetzt.", author: "Arabisches Sprichwort", category: "wisdom", lang: "de" },
        { text: "Glück besteht nicht darin, zu tun, was wir wollen, sondern darin, zu wollen, was wir tun.", author: "Johann Wolfgang von Goethe", category: "happiness", lang: "de" },
        { text: "Sei der Wandel, den du in der Welt sehen möchtest.", author: "Mahatma Gandhi", category: "wisdom", lang: "de" },
        { text: "Das Leben ist wie ein Fahrrad: Um das Gleichgewicht zu halten, musst du in Bewegung bleiben.", author: "Albert Einstein", category: "wisdom", lang: "de" },
        { text: "In der Mitte von jeder Schwierigkeit liegt die Möglichkeit.", author: "Albert Einstein", category: "motivation", lang: "de" },
        { text: "Die Zukunft gehört denen, die an die Wahrhaftigkeit ihrer Träume glauben.", author: "Eleanor Roosevelt", category: "motivation", lang: "de" },
        { text: "Es ist nie zu spät, das zu werden, was du hättest sein können.", author: "George Eliot", category: "motivation", lang: "de" },
        { text: "Alle Träume können wahr werden, wenn wir den Mut haben, sie zu verfolgen.", author: "Walt Disney", category: "motivation", lang: "de" },
        { text: "Das Leben ist 10 % davon, was passiert, und 90 % davon, wie du darauf reagierst.", author: "Charles R. Swindoll", category: "wisdom", lang: "de" },
        { text: "Deine Zeit ist begrenzt, verschwende sie nicht mit dem Leben eines anderen.", author: "Steve Jobs", category: "motivation", lang: "de" },
    ];

    const CATEGORY_LABELS = {
        motivation: 'Motivation',
        wisdom: 'Weisheit',
        success: 'Erfolg',
        happiness: 'Glück',
        humor: 'Humor',
    };

    async function loadQuotes() {
        const btn = document.getElementById('loadBtn');
        const grid = document.getElementById('quotesGrid');
        const errorMsg = document.getElementById('errorMsg');
        const statusBar = document.getElementById('statusBar');

        const category = document.getElementById('categorySelect').value;
        const lang = document.getElementById('langSelect').value;
        const limit = document.getElementById('limitSelect').value;

        btn.disabled = true;
        btn.textContent = 'Lade...';
        errorMsg.style.display = 'none';
        grid.innerHTML = '<div class="loading-msg">Zitate werden geladen...</div>';
        statusBar.textContent = '';

        // Prüfe ob Webhook konfiguriert
        if (!WEBHOOK_URL || WEBHOOK_URL === 'HIER_WEBHOOK_URL_EINTRAGEN') {
            showFallback(category, lang, parseInt(limit), 'API noch nicht konfiguriert – zeige lokale Zitate als Vorschau.');
            btn.disabled = false;
            btn.textContent = 'Neue Zitate laden';
            return;
        }

        try {
            const params = new URLSearchParams({ limit });
            if (category) params.append('category', category);
            if (lang) params.append('lang', lang);

            const res = await fetch(`${WEBHOOK_URL}?${params}`, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const data = await res.json();

            if (!data.quotes || data.quotes.length === 0) {
                grid.innerHTML = '<div class="empty-msg">Keine Zitate für diese Filterung gefunden.<br>Versuche andere Einstellungen.</div>';
                statusBar.textContent = `${data.total || 0} Zitate in der Datenbank`;
            } else {
                renderQuotes(data.quotes);
                statusBar.textContent = `${data.total} Zitate in der Datenbank · ${data.filtered} passen zur Filterung`;
            }

        } catch (err) {
            showFallback(category, lang, parseInt(limit), `API nicht erreichbar (${err.message}) – zeige lokale Fallback-Zitate.`);
        }

        btn.disabled = false;
        btn.textContent = 'Neue Zitate laden';
    }

    function showFallback(category, lang, limit, message) {
        const errorMsg = document.getElementById('errorMsg');
        const statusBar = document.getElementById('statusBar');

        errorMsg.textContent = message;
        errorMsg.style.display = 'block';

        let filtered = FALLBACK_QUOTES;
        if (category) filtered = filtered.filter(q => q.category === category);
        if (lang) filtered = filtered.filter(q => q.lang === lang);

        const shuffled = filtered.sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, limit);

        if (selected.length === 0) {
            document.getElementById('quotesGrid').innerHTML =
                '<div class="empty-msg">Keine Fallback-Zitate für diese Filterung.</div>';
        } else {
            renderQuotes(selected.map(q => ({ ...q, lang: q.lang })));
        }

        statusBar.textContent = `${FALLBACK_QUOTES.length} lokale Fallback-Zitate`;
    }

    function renderQuotes(quotes) {
        const grid = document.getElementById('quotesGrid');
        grid.innerHTML = '';

        quotes.forEach(q => {
            const categoryLabel = CATEGORY_LABELS[q.category] || q.category || '';
            const langLabel = q.lang === 'de' ? 'Deutsch' : q.lang === 'en' ? 'Englisch' : q.lang || '';

            const card = document.createElement('div');
            card.className = 'quote-card';
            card.innerHTML = `
                <div class="quote-text">${escapeHtml(q.text)}</div>
                <div class="quote-author">${escapeHtml(q.author || 'Unbekannt')}</div>
                <div class="quote-meta">
                    ${categoryLabel ? `<span class="tag tag-category">${escapeHtml(categoryLabel)}</span>` : ''}
                    ${langLabel ? `<span class="tag tag-lang-${q.lang || ''}">${escapeHtml(langLabel)}</span>` : ''}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Beim Laden sofort Zitate anzeigen (Fallback bis API konfiguriert)
    loadQuotes();
</script>
</body>
</html>
