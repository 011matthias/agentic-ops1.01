# Herbox Netherlands Infrastructure Configuration
# Documents all n8n instances for the Herbox Netherlands client

instances:
  - type: n8n
    name: n8n-herbox-netherlands
    url: https://herbox.app.n8n.cloud
    health_endpoint: /healthz
    editor_url: https://herbox.app.n8n.cloud
    api_url: https://herbox.app.n8n.cloud/api/v1
    env_key: N8N_HERBOX_NETHERLANDS_API_KEY
