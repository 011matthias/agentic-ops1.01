name: CI

# Unconditional on every PR, so `gh pr checks` never returns "no checks".
# The platform jobs live in platform.yml and the Lead Desk suite in
# lead-desk-tests.yml, each path-filtered (layout plan W1-1).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A re-push to a PR cancels its superseded run; main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hooks:
    name: Enforcement hook tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # dorny/paths-filter lists the PR's files via the API
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      # The expense-recon module joined this scope 2026-09-15. It had never
      # been linted by CI, which is why twelve findings accumulated in it
      # before PR #856 cleared them by hand; a gate that only runs locally
      # runs when somebody remembers. Verified before adding, by injecting an
      # F401 into the module and watching this exact command fail: the root
      # ruff.toml's E9+F ruleset does reach these paths.
      - name: Ruff (real-bug ruleset)
        run: >-
          uv run --no-project --with ruff ruff check
          tools .claude/hooks tools/tests
          workspace/clients/brisken/automations/expense-reconciliation/src
          workspace/clients/brisken/automations/expense-reconciliation/tests
      - name: tools/INDEX.md membership
        run: uv run tools/check-index.py
      - name: Pattern rules lint
        run: uv run tools/pattern_rules.py lint
      # Tests whose inputs any PR can change (the friction register, the
      # committed repo root) run on every PR; the full suite only when its
      # inputs change (layout plan W1-2).
      - name: Ledger and root-layout tests (every PR)
        run: >-
          uv run --no-project --with pytest --with python-pptx --with requests --with httpx --with pyyaml --with openpyxl
          pytest -q tools/tests/test_root_layout.py
          tools/tests/test_validate_output_slop.py -k "friction_register or root"
      - name: Did the suite's inputs change?
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            suite:
              - 'tools/**'
              - '.claude/**'
              - 'pytest.ini'
              - 'ruff.toml'
              - '.github/workflows/**'
              - 'docs/optimize/**'
              - 'workspace/clients/brisken/status/p1-improvement-backlog.md'
              - 'workspace/clients/brisken/automations/expense-reconciliation/**'
              - 'workspace/projects/vinted-reselling/**'
      - name: Run enforcement-layer test suite
        if: github.event_name != 'pull_request' || steps.filter.outputs.suite == 'true'
        run: uv run --no-project --with pytest --with python-pptx --with requests --with httpx --with pyyaml --with openpyxl pytest tools/tests

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # W1-35: default rules plus the house shapes they miss (Make MCP
          # URL, bare Zoho token, token-named files).
          GITLEAKS_CONFIG: .gitleaks.toml
      # W1-14: personal data in the lines this PR/push adds, counts only.
      # Reports as warnings and never fails the job (client-ops guard,
      # PLAN.md 2026-10-28): the local pii-push-gate asks before a push.
      - name: Personal-data scan (added lines, counts only)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          python3 tools/pii_scan.py --range "$RANGE" > pii.txt || true
          while IFS= read -r line; do echo "::warning title=Personal data (counts only)::$line"; done < pii.txt
          echo "$(wc -l < pii.txt) file(s) flagged"
